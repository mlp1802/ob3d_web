
version: '3.8'
services:
  api:
    build: .
    volumes:
      - ../game:/game  # Mount game workspace
      - .:/web  # Mount web service
      - ./files:/files 
      - cargo_target:/web/target  # Use a separate target dir inside the container
    working_dir: /web
    command: cargo run
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://mongo:27017"

#  static:
#    image: nginx:latest
#    volumes:
#      - ./data:/usr/share/nginx/html:ro  # Serve static files
#      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Custom Nginx config

  mongo:
    image: mongo:latest
    volumes:
      - ./mongo_data:/data/db

  traefik:
    image: traefik:v2.10
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"  # Correct internal path
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Allow Traefik to detect containers
      - ./traefik.yml:/etc/traefik/traefik.yml:ro  # Correct file mount
volumes:
  cargo_target:
  mongo_data:

