version: '3.8'

services:
  api:
    image: rust:latest
    volumes:
      - ../game:/game  # Mount game workspace
      - .:/web  # Mount web service
      - cargo_target:/web/target  # Use a separate target dir inside the container
    working_dir: /web
    command: ["/bin/sh", "-c", "apt update && apt install -y libudev-dev cmake g++ clang libasound2-dev mold && cargo run"]
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://mongo:27017"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=api-strip-prefix"

  mongo:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db

  traefik:
    image: traefik:v2.10
    restart: unless-stopped
    command:
      - "--api.dashboard=true" # Enable Traefik dashboard (optional)
      - "--providers.docker=true" # Enable Docker integration
      - "--entrypoints.web.address=:80" # ONLY HTTP, NO HTTPS
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Allow Traefik to discover services

  
  static:
    image: nginx:latest
    volumes:
      - ./data:/usr/share/nginx/html:ro  # Serve files directly from ./data
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Correct config path
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static.rule=PathPrefix(`/data`)"  # Matches requests to /data/*
      - "traefik.http.routers.static.entrypoints=web"
      - "traefik.http.services.static.loadbalancer.server.port=80"
      - "traefik.http.middlewares.static-strip-prefix.stripprefix.prefixes=/data"
      - "traefik.http.routers.static.middlewares=static-strip-prefix"
 
volumes:
  cargo_target:
  mongo_data:

