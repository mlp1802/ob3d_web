version: '3.8'

services:
  api:
    build: .
    volumes:
      - ../game:/game  # Mount game workspace
      - .:/web  # Mount web service
      - cargo_target:/web/target  # Use a separate target dir inside the container
    working_dir: /web
    command: cargo run
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://mongo:27017"
    ports:
      - "8000:8000"

  mongo:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db

volumes:
  cargo_target:
  mongo_data:

